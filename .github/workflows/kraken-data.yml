name: kraken-data

on:
  schedule:
    - cron: "17,47 * * * *"  # óránként kétszer (UTC); a GitHub késleltetheti/kihagyhatja a futásokat
  workflow_dispatch: {}       # kézi indítás az Actions fülön

permissions:
  contents: write

concurrency:
  group: kraken-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Kraken adatok letöltése
        run: python scripts/fetch_kraken.py
      - name: Mentés a tárolóba
        if: always()
        run: |
          git config user.name "medusa-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nincs új adat."
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              echo "Push sikertelen ($i/3)"; sleep 20
            done
            [ "$ok" = 1 ]
          fi
