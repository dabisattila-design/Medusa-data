name: vol-forecast

on:
  schedule:
    - cron: "41 4 * * *"     # naponta 04:41 UTC: a Kraken órás és a Binance napi adat már bent van
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: medusa-data-push
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: D-006 napi volatilitás-előrejelzés (rögzített paraméterek)
        run: python scripts/vol_forecast_daily.py
      - name: Mentés a tárolóba
        if: always()
        run: |
          git config user.name "medusa-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/d006
          if git diff --cached --quiet; then
            echo "Nincs új előrejelzés."
          else
            git commit -m "d006 forecast: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
